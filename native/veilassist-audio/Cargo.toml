# Native PCM helpers for STT hot path (48 kHz Int16LE → 16 kHz Float32).

[package]
name = "veilassist_audio"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
